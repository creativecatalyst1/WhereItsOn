<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>WhereItsOn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=Doto:wght@700;900&display=swap">
<style>
/* Layout: one Android phone column styled as a stadium scoreboard. Your teams sit on top as big game-center boards (score, win-chance trend, last scoring play), then a wall of live score boxes and a feed of scoring plays with win-chance swings. */
:root{
  --bg:#090a08; --board:#121410; --well:#050604; --bezel:#2a2d22; --line:#23261d;
  --paint:#f0ebdc; --muted:#8f8c7a;
  --amber:#ffb21a; --amber-dim:#33260a; --amber-glow:rgba(255,178,26,.55);
  --red:#ff4338; --red-dim:#36100d; --green:#45f08a; --green-dim:#0e2e1d;
  --ink:#1a1200;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --led:"Doto",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--paint);font-family:var(--body);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
/* desktop with a mouse: show the app inside a phone frame (touch screens get the real layout) */
@media (min-width:640px) and (hover:hover) and (pointer:fine){
  body{padding-block:24px}
  .app{height:860px;min-height:0;border:10px solid var(--bezel);border-radius:30px;overflow:hidden}
  .scroll{overflow-y:auto}
}
.scroll{flex:1;display:flex;flex-direction:column}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);border-bottom:1px solid var(--bezel);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.04em;line-height:1;text-transform:uppercase}
.logo b{color:var(--amber);text-shadow:0 0 8px var(--amber-glow)}
.daytag{font-family:var(--led);font-weight:700;font-size:15px;color:var(--amber);opacity:.85;margin-top:4px;letter-spacing:.04em;white-space:nowrap}
.bell{position:relative;flex:none;width:44px;height:44px;border-radius:8px;border:1px solid var(--bezel);background:var(--well);display:grid;place-items:center;color:var(--amber)}
.bell svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pip{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font:700 12px/1 var(--display);display:grid;place-items:center;padding:0 5px;box-shadow:0 0 8px rgba(255,67,56,.6)}

.demo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px 0}
.demo .chip{height:32px;padding:0 12px;font-size:14px}
.main{flex:1;padding:16px 16px 28px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
h2{font-family:var(--display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.section{display:flex;flex-direction:column;gap:10px}

/* LED digits: a dim ghost sits under the lit value, like unlit segments */
.led{display:inline-grid;justify-items:end;font-family:var(--led);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.led>*{grid-area:1/1}
.led .ghost{color:var(--amber-dim)}
.led .on{color:var(--amber);text-shadow:0 0 8px var(--amber-glow)}

/* filters */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 12px;border-radius:6px;border:1px solid var(--bezel);background:var(--board);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--muted)}
.chip .n{font-family:var(--led);font-weight:700;font-size:15px;color:var(--amber-dim);letter-spacing:0}
.chip[aria-pressed="true"]{color:var(--amber);border-color:var(--amber);background:var(--amber-dim);box-shadow:0 0 10px rgba(255,178,26,.2)}
.chip[aria-pressed="true"] .n{color:var(--amber)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.switch{width:48px;height:28px;border-radius:6px;background:var(--well);border:1px solid var(--bezel);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:4px;background:#3a3c31;transition:transform .15s,background .15s}
.switch[aria-checked="true"]{border-color:var(--amber)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--amber);box-shadow:0 0 8px var(--amber-glow)}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}

/* shared card parts */
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--board);border:1px solid var(--bezel);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;text-align:left;width:100%}
.card:active{filter:brightness(1.15)}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;background:#0c0d0a;border-bottom:1px solid var(--line)}
.league{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:flex;align-items:center;gap:8px;flex:none}
.tag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--muted);display:flex;align-items:center;gap:6px}
.tag.live{color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.clock{font-family:var(--led);font-weight:700;font-size:18px;color:var(--amber);text-shadow:0 0 6px var(--amber-glow);line-height:1;white-space:nowrap}
.clock.dim{color:var(--muted);text-shadow:none}
.well{margin:10px 12px 0;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;row-gap:2px;column-gap:12px}
.team{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.15;text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.fav::after{content:" ★";color:var(--amber);font-size:16px}
.well .led{font-size:34px}
.event{grid-column:1/-1;padding:2px 0}
.event .t{font-family:var(--display);font-weight:700;font-size:25px;text-transform:uppercase;letter-spacing:.03em;line-height:1.15}
.event .s{color:var(--muted);font-size:14px}
.seg{margin:10px 12px 0;height:6px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--red-dim) 0 6px,transparent 6px 9px)}
.seg i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--red) 0 6px,transparent 6px 9px)}
.watch{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 12px 12px}
.net{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex-basis:100%}
.svc{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.svc::before{content:"";width:9px;height:9px;border-radius:50%;background:#33352b;flex:none}
.svc.own{color:var(--paint)}
.svc.own::before{background:var(--green);box-shadow:0 0 7px var(--green)}
.lamp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.lamp::before{content:"";width:8px;height:8px;border-radius:50%;background:#33352b;flex:none}
.lamp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lamp.own{color:var(--paint)}
.lamp.own::before{background:var(--green);box-shadow:0 0 7px var(--green)}
.pill{flex:none;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--amber);border-radius:4px;padding:2px 7px;line-height:1.3}

/* win chance */
.wp{padding:10px 12px 0;display:flex;flex-direction:column;gap:8px}
.wp-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wp-now{font-family:var(--led);font-weight:900;font-size:28px;color:var(--amber);text-shadow:0 0 8px var(--amber-glow);line-height:1}
.wp-now small{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;color:var(--muted);text-shadow:none;margin-right:6px}
.trend{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.trend.up{color:var(--amber)}
.trend.down{color:var(--red)}
.spark{width:100%;height:auto;display:block;background:var(--well);border:1px solid var(--line);border-radius:6px}
.spark .grid{stroke:var(--line);stroke-width:1}
.spark .mid{stroke:var(--bezel);stroke-width:1;stroke-dasharray:3 4}
.spark .line{fill:none;stroke:var(--amber);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .area{fill:var(--amber);fill-opacity:.14;stroke:none}
.spark .pt{fill:var(--amber)}
.spark .halo{fill:var(--amber);fill-opacity:.25}
.spark .nowpt{fill:var(--amber);stroke:var(--well);stroke-width:2}
.wpbar{height:8px;border-radius:2px;background:var(--bezel);overflow:hidden}
.wpbar i{display:block;height:100%;background:var(--amber);box-shadow:0 0 8px var(--amber-glow)}
.swing{flex:none;text-align:right;font-family:var(--led);font-weight:900;font-size:20px;line-height:1}
.swing small{display:block;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.1em;color:var(--muted);margin-top:4px;text-shadow:none}
.swing.up{color:var(--amber);text-shadow:0 0 6px var(--amber-glow)}
.swing.down{color:var(--red)}

/* my teams hero boards */
.hero{background:var(--board);border:1px solid var(--bezel);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.hero.liveh{border-color:#5a2a25}
.hero-main{display:flex;flex-direction:column;text-align:left;width:100%}
.hero-main:active{filter:brightness(1.12)}
.hero .well .led{font-size:46px}
.hero .team{font-size:29px}
.lastplay{margin:10px 12px 0;display:flex;align-items:center;gap:10px}
.lp-txt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.lp-txt small{display:block;color:var(--muted);font-size:12px}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 12px}
.hero-foot .watch{padding:0;flex:1;min-width:0}
.count{margin:10px 12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.count .led{font-size:40px}

/* live score wall */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sbox{background:var(--board);border:1px solid var(--bezel);border-radius:10px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.sbox:active{filter:brightness(1.15)}
.sb-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sb-lg{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--muted)}
.sb-clk{font-family:var(--led);font-weight:700;font-size:15px;color:var(--amber);white-space:nowrap}
.sb-rows{background:var(--well);border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px}
.ab{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.04em}
.ab.fav::after{content:" ★";color:var(--amber);font-size:12px}
.sbox .led{font-size:28px}
.sb-ev{background:var(--well);border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:2px}
.sb-ev b{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.sb-ev span{font-size:12px;color:var(--muted)}
.sb-wp{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--paint)}
.sb-wp .wpbar{flex:1;min-width:0}
.sb-wp .trend{font-size:13px}
.sbox .lamp{margin-top:auto}

/* scoring plays feed */
.plays{display:flex;flex-direction:column;gap:8px}
.play{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--board);border:1px solid var(--bezel);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.play:active{filter:brightness(1.15)}
.ago{font-family:var(--led);font-weight:900;font-size:22px;color:var(--amber);text-shadow:0 0 6px var(--amber-glow);line-height:1;text-align:center}
.ago small{display:block;font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.1em;color:var(--muted);margin-top:5px;text-shadow:none}
.pbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.l1{display:flex;align-items:center;gap:8px}
.mu{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ptx{font-size:15px;line-height:1.3}
.ptx .when{color:var(--muted)}
.empty{background:var(--well);border:1px dashed var(--bezel);border-radius:10px;padding:20px 16px;text-align:center;color:var(--muted);font-size:14px}
.slot{font-family:var(--led);font-weight:900;font-size:24px;color:var(--amber);text-shadow:0 0 8px var(--amber-glow);line-height:1;margin-top:6px}

/* teams */
.search{height:48px;border-radius:8px;border:1px solid var(--bezel);background:var(--well);padding:0 16px;font:inherit;color:var(--paint);width:100%}
.search::placeholder{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;background:var(--board);border:1px solid var(--bezel);border-radius:10px;padding:10px 12px}
.row .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.row .name{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.row .name small{font-weight:600;font-size:14px;color:var(--muted);letter-spacing:.08em}
.row .what{font-size:13px;color:var(--muted)}
.row .what.live{color:var(--red);font-weight:600}
.tile{width:44px;height:44px;border-radius:6px;background:var(--well);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--led);font-weight:900;font-size:15px;color:var(--amber);flex:none}
.star{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;font-size:22px;color:var(--muted);flex:none}
.star[aria-pressed="true"]{color:var(--amber);text-shadow:0 0 8px var(--amber-glow)}

/* apps */
.panel{background:var(--board);border:1px solid var(--bezel);border-radius:10px;padding:2px 14px}
.approw{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.approw:last-child{border-bottom:0}
.approw .info{flex:1;min-width:0}
.approw .nm{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.approw .what{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--well);border:1px solid var(--line);border-radius:8px;padding:10px 12px}

/* nav */
.nav{position:sticky;bottom:0;z-index:6;background:var(--board);border-top:1px solid var(--bezel);display:grid;grid-template-columns:repeat(4,1fr);padding:0 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 0 4px}
.tab::before{content:"";width:34px;height:3px;border-radius:0 0 3px 3px;background:transparent;margin-bottom:6px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--amber)}
.tab[aria-selected="true"]::before{background:var(--amber);box-shadow:0 0 10px var(--amber-glow)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:420px;max-height:90%;overflow-y:auto;background:var(--board);border:1px solid var(--bezel);border-bottom:0;border-radius:16px 16px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .wp{padding:0}
.grab{width:36px;height:4px;border-radius:2px;background:var(--bezel);align-self:center}
.sheet-title{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.lab{font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600;white-space:nowrap}
.bigboard{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.side .nm{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.side .led{font-size:60px}
.splay{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.splay:last-child{border-bottom:0}
.splay .w{font-family:var(--led);font-weight:700;font-size:14px;color:var(--amber)}
.splay .tx{font-size:14px;line-height:1.3;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.opt .info{flex:1;min-width:0}
.opt .nm{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.opt .what{font-size:13px;color:var(--muted)}
.opt .when{font-family:var(--led);font-weight:700;font-size:14px;color:var(--amber);flex:none}
.btn{height:42px;padding:0 18px;border-radius:6px;background:var(--amber);color:var(--ink);font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;flex:none;box-shadow:0 0 12px rgba(255,178,26,.25)}
.btn.ghost{background:none;color:var(--paint);border:1px solid var(--bezel);box-shadow:none}
.btn.sm{height:36px;padding:0 14px;font-size:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paint);color:var(--ink);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.5)}
.sample{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}

/* review tab, notes, shared setup */
.nav{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{position:relative}

/* win chance helpers */
function series(g,t){
  const pts=[{p:0,wp:W(g,t,g.pre)}];
  (g.plays||[]).forEach(pl=>{if(pl.wp!=null)pts.push({p:pl.p,wp:W(g,t,pl.wp),play:true})});
  pts.push({p:g.prog,wp:W(g,t,g.wp),now:true});
  return pts;
}
function swings(g){let prev=g.pre;return (g.plays||[]).map(pl=>{if(pl.wp==null)return null;const d=pl.wp-prev;prev=pl.wp;return d})}
function wpTrend(g,t,back=15){let base=g.pre;(g.plays||[]).forEach(pl=>{if(pl.wp!=null&&pl.ago>=back)base=pl.wp});const raw=g.wp-base;return t===focusOf(g)?raw:-raw}
function spark(g,t){
  const Wd=300,H=60,pad=5;
  const pts=series(g,t);
  const X=p=>pad+p*(Wd-2*pad),Y=w=>pad+(1-w/100)*(H-2*pad);
  const d=pts.map((q,i)=>`${i?'L':'M'}${X(q.p).toFixed(1)} ${Y(q.wp).toFixed(1)}`).join('');
  const last=pts[pts.length-1];
  const area=`${d}L${X(last.p).toFixed(1)} ${H-pad}L${X(0).toFixed(1)} ${H-pad}Z`;
  const marks=pts.filter(q=>q.play).map(q=>`<circle class="pt" cx="${X(q.p).toFixed(1)}" cy="${Y(q.wp).toFixed(1)}" r="2.6"/>`).join('');
  const lx=X(last.p).toFixed(1),ly=Y(last.wp).toFixed(1);
  return `<svg class="spark${g.status==='live'?' live':''}" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Win chance for ${esc(t)}: ${pts[0].wp}% at the start, ${last.wp}% now">
    <line class="grid" x1="${pad}" x2="${Wd-pad}" y1="${Y(75).toFixed(1)}" y2="${Y(75).toFixed(1)}"/>
    <line class="grid" x1="${pad}" x2="${Wd-pad}" y1="${Y(25).toFixed(1)}" y2="${Y(25).toFixed(1)}"/>
    <line class="mid" x1="${pad}" x2="${Wd-pad}" y1="${Y(50).toFixed(1)}" y2="${Y(50).toFixed(1)}"/>
    <path class="area" d="${area}"/><path class="line" pathLength="1" d="${d}"/>${marks}
    <circle class="halo" cx="${lx}" cy="${ly}" r="8"/><circle class="nowpt" cx="${lx}" cy="${ly}" r="4.5"/></svg>`;
}
function trendHTML(tr,suffix=' in 15 min'){
  if(!tr)return `<span class="trend">Steady</span>`;
  return `<span class="trend ${tr>0?'up':'down'}">${tr>0?'▲':'▼'} ${Math.abs(tr)}${suffix}</span>`;
}
function wpBlock(g,t){
  t=t||focusOf(g);
  return `<div class="wp"><div class="wp-top"><span class="lab">${g.status==='final'?'Win chance, full game':g.title?'Leader win chance':'Win chance'}</span><span class="wp-now"><small>${esc(abbr(t))}</small>${W(g,t,g.wp)}%</span>${g.status==='final'?'':trendHTML(wpTrend(g,t))}</div>${spark(g,t)}</div>`;
}
function swingHTML(g,d){
  if(d==null||d===0)return '<span></span>';
  return `<span class="swing ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)}<small>${esc(abbr(focusOf(g)))} WIN %</small></span>`;
}

function heroGames(){
  const out=[];
  games().forEach(g=>{
    const fav=favOf(g);
    if(!fav)return;
    if(g.status==='live')out.push({g,fav,order:-1});
    else if(g.status==='soon'){const d=until(g);if(d<=180)out.push({g,fav,order:d})}
  });
  return out.sort((a,b)=>a.order-b.order);
}
function laterFavs(){
  const out=[];
  games().forEach(g=>{
    if(g.status!=='soon')return;
    const fav=favOf(g);

  });
  return out.sort((a,b)=>until(a.g)-until(b.g));

  const list=filtered(pool);
  const today=list.filter(g=>g.status==='soon'&&!g.day);
  const tmrw=list.filter(g=>g.status==='soon'&&g.day).sort((a,b)=>mins(a.time)-mins(b.time));
  const groups={};today.sort((a,b)=>mins(a.time)-mins(b.time)).forEach(g=>(groups[g.time]??=[]).push(g));
  const finals=list.filter(g=>g.status==='final');
  view.innerHTML=`
    <div class="section"><h1>Coming up</h1><p class="sub">${pool.filter(g=>g.status==='soon'&&!g.day).length} games later today · ${pool.filter(g=>g.day).length} tomorrow · Pacific time</p></div>
    <div class="section">${chipsHTML(pool)}</div>
    ${Object.keys(groups).length?Object.entries(groups).map(([t,gs])=>`<div class="section"><div class="slot">${t}</div><div class="list">${gs.map(cardHTML).join('')}</div></div>`).join('')
      :`<div class="empty">No more games today match these filters.</div>`}
    ${tmrw.length?`<div class="section"><div class="slot">TOMORROW</div><div class="list">${tmrw.map(cardHTML).join('')}</div></div>`:''}
    ${finals.length?`<div class="section"><h2>Earlier</h2><div class="list">${finals.map(cardHTML).join('')}</div></div>`:''}
    <p class="sample">Snapshot · Oct 9–12, 2026 · scores from public recaps</p>`;
}
function teamLine(name,extra){
  const g=gameFor(name);
  if(g&&!(g.status==='final'&&extra)){
    const ev=!!g.title;
    const opp=ev?g.title:(g.away===name?'@ '+g.home:'vs '+g.away);
    const where=ownedSvc(g);
    if(g.status==='live')return {cls:'live',txt:`Live now ${opp} · ${where?svcName(where):g.net}`,game:g.id};
    if(g.status==='final')return {cls:'',txt:ev?`Final · ${g.title}`:`Final ${opp} · ${g.away===name?g.as+'–'+g.hs:g.hs+'–'+g.as}`,game:g.id};
    return {cls:'',txt:`${g.day?'Tomorrow':'Today'} ${g.time} ${opp} · ${where?svcName(where):g.net+' (not in your apps)'}`,game:g.id};
  }
  if(extra){const where=extra.watch&&extra.watch.find(w=>state.owned.has(w));
    return {cls:'',txt:extra.watch?`Next: ${extra.text} · ${where?svcName(where):extra.net}`:extra.text}}
  return {cls:'',txt:'No game in this window'};
}
function teamRow([name,league,extra]){
  const l=teamLine(name,extra);
  return `<div class="row">${teamIco(name,'lg')}
    <button class="info" ${l.game?`data-game="${l.game}"`:''}><span class="name">${esc(name)} <small>${esc(league)}</small></span><span class="what ${l.cls}">${esc(l.txt)}</span></button>
    <button class="star" data-fav="${esc(name)}" aria-pressed="${isFav(name)}" aria-label="${isFav(name)?'Remove':'Add'} ${esc(name)} ${isFav(name)?'from':'to'} my teams">${isFav(name)?'★':'☆'}</button></div>`;
}
function renderTeams(){

/* sheets */
function toast(msg){
  document.querySelector('.toast')?.remove();
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),220)},2400);
}
function showSheet(inner,handler,quiet){
  const scrim=document.createElement('div');scrim.className='scrim';
  scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
  if(quiet)scrim.style.animation=scrim.firstChild.style.animation='none';
  document.body.appendChild(scrim);
  scrim.addEventListener('click',e=>{
    if(scrim.classList.contains('closing'))return;
    if(e.target===scrim||e.target.closest('[data-close]'))return closeSheet(scrim);
    handler(e,scrim);
  });
  if(!quiet)drawCharts(scrim,280);
  return scrim;
}
function closeSheet(scrim){
  if(!scrim||scrim.classList.contains('closing'))return;
  if(RMQ.matches)return scrim.remove();
  scrim.style.animation=scrim.firstChild.style.animation='';
  scrim.classList.add('closing');setTimeout(()=>scrim.remove(),230);
}
function openSheet(id,quiet){
  const g=games().find(x=>x.id===id);if(!g)return;
  const owned=g.watch.filter(w=>state.owned.has(w)),other=g.watch.filter(w=>!state.owned.has(w));
  const head=g.title
    ?`<div class="bigboard"><div class="side" style="grid-column:1/-1"><span class="nm">${esc(g.title)}</span><span class="sub">${esc(g.sub)}</span></div></div>`
    :`<div class="bigboard">
        <div class="side"><span class="lab">Away</span>${teamIco(g.away,'md')}<span class="nm">${esc(g.away)}</span>${led(g.as??'')}</div>
        <div class="side"><span class="lab">Home</span>${teamIco(g.home,'md')}<span class="nm">${esc(g.home)}</span>${led(g.hs??'')}</div>
      </div>`;
  let odds='';
  if((g.status==='live'||(g.status==='final'&&g.plays&&g.plays.length))&&g.wp!=null)odds=wpBlock(g,g.title?focusOf(g):([g.away,g.home].find(isFav)||focusOf(g)));
  else if(g.status==='soon'&&g.pre!=null){const t=g.title?focusOf(g):([g.away,g.home].find(isFav)||focusOf(g)),p=W(g,t,g.pre);
    odds=`<div class="wp"><div class="wp-top"><span class="lab">Pregame win chance</span><span class="wp-now"><small>${esc(abbr(t))}</small>${p}%</span></div><div class="wpbar"><i style="width:${p}%"></i></div></div>`}
  let plays='';
  if(g.plays&&g.plays.length){
    const sw=swings(g);
    plays=`<h2>Scoring plays</h2><div>${g.plays.map((pl,i)=>({pl,d:sw[i]})).reverse().map(({pl,d})=>`<div class="splay"><span class="w">${esc(pl.when)}${pl.approx?'<small class="apx">approx</small>':''}</span><span class="tx"><span class="pill">${esc(pl.label)}</span>${esc(pl.text)}</span>${swingHTML(g,d)}</div>`).join('')}</div>`;
  }
  const reminded=state.reminders.has(id);
  showSheet(`
    <span class="grab"></span>
    <div class="head" style="border:0;background:none;padding:0"><span class="league">${esc(g.league)}</span><span class="status">${statusHTML(g)}</span></div>
    ${head}${odds}${plays}
    <h2>Where to watch · ${esc(g.net)}</h2>
    ${owned.map(w=>`<div class="opt">${svcIco(w,'md')}<div class="info"><div class="nm">${esc(svcName(w))}</div><div class="what">In your apps</div></div><button class="btn" data-open="${w}">${g.status==='live'?'Watch':'Open'}</button></div>`).join('')}
    ${other.map(w=>`<div class="opt">${svcIco(w,'md')}<div class="info"><div class="nm">${esc(svcName(w))}</div><div class="what">Not in your apps</div></div><button class="btn ghost" data-add="${w}">I have it</button></div>`).join('')}
    ${!owned.length&&g.watch.length?`<div class="note">None of your apps carry this game. Mark a service above if you have it.</div>`:''}
    <div class="actions">${g.status==='soon'?`<button class="btn ghost" data-remind>${reminded?'Reminder on':'Remind me'}</button>`:''}<button class="btn ghost" data-close>Close</button></div>`,
  (e,scrim)=>{
    const o=e.target.closest('[data-open]');if(o){toast(`In the live app, this opens ${svcName(o.dataset.open)} straight to the game.`);return}
    const a=e.target.closest('[data-add]');if(a){state.owned.add(a.dataset.add);save();scrim.remove();render();openSheet(id,true);toast(`${svcName(a.dataset.add)} added to your apps`);return}
    const r=e.target.closest('[data-remind]');if(r){
      if(state.reminders.has(id)){state.reminders.delete(id);r.textContent='Remind me';toast('Reminder removed')}
      else{state.reminders.add(id);r.textContent='Reminder on';toast(`Reminder set for 15 minutes before ${g.time}`)}
      save();render();
    }
  },quiet);
}
function openAlerts(){
  state.read=true;save();updatePip();
  const all=Object.values(SCEN).flatMap(s=>s.games);
  const rem=[...state.reminders].map(id=>all.find(g=>g.id===id)).filter(Boolean);
  const remName=r=>r.title?r.title:`${r.away} @ ${r.home}`;
  const remHTML=r=>`<div class="opt" data-rem="${r.id}"><div class="info"><div class="nm">${esc(remName(r))}</div><div class="what">15 min before · ${r.day?'Tomorrow ':''}${esc(r.time)}</div></div><button class="btn ghost sm" data-unrem="${r.id}">Off</button></div>`;
  showSheet(`
    <span class="grab"></span>
    <div class="sheet-title">Alerts</div>
    <h2>Recent</h2>
    ${scen().inbox.map(n=>`<div class="opt"><div class="info"><div class="nm">${esc(n.t)}</div><div class="what">${esc(n.d)}</div></div><span class="when">${esc(n.when)}</span></div>`).join('')}
    <h2>My reminders</h2>
    <div class="section" id="remList">${rem.length?rem.map(remHTML).join(''):`<div class="empty">No reminders yet. Open an upcoming game and tap Remind me.</div>`}</div>
    <h2>Notify me about</h2>
    ${ALERT_OPTS.map(([k,t,d])=>`<div class="opt"><div class="info"><div class="nm" id="al-${k}">${t}</div><div class="what">${d}</div></div><button class="switch" role="switch" data-alert="${k}" aria-labelledby="al-${k}" aria-checked="${!!state.alerts[k]}"></button></div>`).join('')}
    <div class="note">In the full app, Android asks permission to send notifications the first time you turn one on.</div>
    <div class="actions"><button class="btn ghost" data-close>Close</button></div>`,
  (e)=>{
    const sw=e.target.closest('[data-alert]');if(sw){const k=sw.dataset.alert;state.alerts[k]=!state.alerts[k];sw.setAttribute('aria-checked',state.alerts[k]);save();return}
    const u=e.target.closest('[data-unrem]');if(u){
      state.reminders.delete(u.dataset.unrem);save();
      u.closest('[data-rem]').remove();
      const list=document.getElementById('remList');
      if(!list.children.length)list.innerHTML=`<div class="empty">No reminders yet. Open an upcoming game and tap Remind me.</div>`;
      render();
    }
  });
}

document.addEventListener('click',e=>{
  if(e.target.closest('.scrim,.intro'))return;
  if(e.target.closest('[data-intro]')){playIntro();return}
  if(e.target.closest('[data-bell]')){openAlerts();return}
  const sc=e.target.closest('[data-scen]');if(sc){const moved=state.scen!==sc.dataset.scen;state.scen=sc.dataset.scen;state.sport='all';state.read=false;save();render();if(moved)sceneFX();return}
  const tab=e.target.closest('.tab');if(tab){const from=state.tab;if(tab.dataset.tab==='review'&&state.tab!=='review')state.from=state.tab;state.tab=tab.dataset.tab;state.sport='all';render();document.getElementById('scroll').scrollTop=0;window.scrollTo(0,0);if(from!==state.tab)tabFX(from,state.tab);return}
  const chip=e.target.closest('[data-sport]');if(chip){state.sport=chip.dataset.sport;render();return}
  if(e.target.closest('#mine')){state.onlyMine=!state.onlyMine;save();render();return}
  const sv=e.target.closest('[data-svc]');if(sv){const id=sv.dataset.svc;state.owned.has(id)?state.owned.delete(id):state.owned.add(id);save();render();return}
  const fav=e.target.closest('[data-fav]');if(fav){const n=fav.dataset.fav;isFav(n)?state.favs.delete(n):state.favs.add(n);save();render();return}
  const wt=e.target.closest('[data-watch]');if(wt){
    const g=games().find(x=>x.id===wt.dataset.watch),o=ownedSvc(g);
    if(o)toast(`In the live app, this opens ${svcName(o)} straight to the game.`);else openSheet(g.id);
    return}
  const rc=e.target.closest('[data-remindcard]');if(rc){
    const id=rc.dataset.remindcard,g=games().find(x=>x.id===id);
    if(state.reminders.has(id)){state.reminders.delete(id);toast('Reminder removed')}else{state.reminders.add(id);toast(`Reminder set for 15 minutes before ${g.time}`)}
    save();render();return}
  const kd=e.target.closest('[data-kind]');if(kd){state.noteKind=kd.dataset.kind;document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===state.noteKind));return}
  const ns=e.target.closest('#noteSend');if(ns){sendNote(ns);return}
  const nd=e.target.closest('[data-note-done]');if(nd){toggleDone(nd.dataset.noteDone);return}
  const nx=e.target.closest('[data-note-del]');if(nx){deleteNote(nx.dataset.noteDel);return}
  if(e.target.closest('[data-shared]')){toggleShared();return}
  const gm=e.target.closest('[data-game]');if(gm){openSheet(gm.dataset.game)}
});

/* shared setup and review notes (db + user capabilities; the page works without them) */
const CLOUD={db:null,user:null,me:null,canWrite:null,notes:[],sharedOn:store.get('sharedOn',true)};
const TABNAMES={now:'On Now',later:'Later',teams:'My Teams',apps:'My Apps',review:'Review'};
const KINDS=[['idea','Idea'],['problem','Problem'],['like','Like']];
state.noteKind='idea';state.from='now';
let pushTimer=null,pushing=false,pushAgain=false,lastJSON='';
const canon=o=>JSON.stringify({favs:[...(o.favs||[])].sort(),owned:[...(o.owned||[])].sort(),reminders:[...(o.reminders||[])].sort(),alerts:Object.fromEntries(Object.entries(o.alerts||{}).sort())});
const prefsObj=()=>({favs:[...state.favs],owned:[...state.owned],reminders:[...state.reminders],alerts:state.alerts});
function schedulePush(){
  if(!CLOUD.db||!CLOUD.sharedOn||CLOUD.canWrite===false)return;
  clearTimeout(pushTimer);pushTimer=setTimeout(pushPrefs,500);
}
async function pushPrefs(){
  pushTimer=null;
  if(pushing){pushAgain=true;return}
  const mine=canon(prefsObj());
  if(mine===lastJSON)return;
  pushing=true;
  try{
    const o=JSON.parse(mine);
    await CLOUD.db.doc('shared/prefs').set({...o,at:Date.now()});
    lastJSON=mine;
  }catch(e){
    if(e&&e.code==='invalid_argument')CLOUD.canWrite=false;
  }
  pushing=false;
  if(pushAgain){pushAgain=false;schedulePush()}
}
function onPrefs(snap){
  if(!snap.exists||!CLOUD.sharedOn)return;
  const d=snap.data(),c=canon(d);
  if(c===canon(prefsObj())){lastJSON=c;return}
  if(pushTimer||pushing)return;
  state.favs=new Set(d.favs||[]);state.owned=new Set(d.owned||[]);state.reminders=new Set(d.reminders||[]);
  state.alerts=Object.assign({start:true,score:false,swing:true,final:true,gap:true},d.alerts||{});
  lastJSON=c;saveLocal();
  if(state.tab!=='review'&&document.activeElement?.id!=='q')render();
}
function ago(at){
  const m=Math.max(0,Math.round((Date.now()-at)/60000));
  if(m<1)return 'just now';if(m<60)return m+' min ago';
  const h=Math.round(m/60);if(h<24)return h+' hr ago';
  return new Date(at).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
async function fillNames(){
  const els=[...document.querySelectorAll('[data-by]')];
  const ids=[...new Set(els.map(e=>e.dataset.by).filter(Boolean))];
  if(!CLOUD.user||!ids.length)return;
  const ps=await CLOUD.user.profiles(ids);
  els.forEach(e=>{const p=ps[e.dataset.by];e.textContent=p?(p.isMe?'You':(p.name||'Someone')):'Someone'});
}
function noteHTML(n){
  const mine=n.by&&n.by===CLOUD.me,writable=CLOUD.canWrite!==false;
  const kind=['idea','problem','like'].includes(n.kind)?n.kind:'idea';
  return `<div class="ncard ${n.done?'done':''}">
    <div class="nc-top"><span class="pill ${kind}">${kind.toUpperCase()}</span><span class="nc-ctx">${esc(TABNAMES[n.tab]||'')}${n.scen&&SCEN[n.scen]?' · '+esc(SCEN[n.scen].label):''}</span><span class="nc-when">${esc(ago(n.at||Date.now()))}</span></div>
    <div class="nc-text">${esc(n.text||'')}</div>
    <div class="nc-foot"><span class="nc-by" ${n.by?`data-by="${esc(n.by)}"`:''}>Someone</span>
      ${writable?`<button class="btn ghost sm" data-note-done="${esc(n.id)}">${n.done?'Reopen':'Mark done'}</button>`:''}
      ${mine?`<button class="btn ghost sm" data-note-del="${esc(n.id)}">Delete</button>`:''}</div>
  </div>`;
}
function updateBadge(){
  const open=CLOUD.notes.filter(n=>!n.done).length,b=document.getElementById('notecnt');
  b.hidden=!open;b.textContent=open;
}
function updateNotes(){
  const el=document.getElementById('noteList');if(!el)return;
  el.innerHTML=CLOUD.notes.length?CLOUD.notes.map(noteHTML).join(''):`<div class="empty">No notes yet. Add the first one above.</div>`;
  const h=document.getElementById('noteHead');if(h)h.textContent=`Notes · ${CLOUD.notes.length}`;
  fillNames();
}
function onNotes(snap){
  CLOUD.notes=snap.docs.map(d=>({id:d.id,...d.data()}));
  updateBadge();
  if(state.tab==='review')updateNotes();
}
function renderReview(){
  const canW=CLOUD.canWrite!==false;
  const ctx=`${TABNAMES[state.from]||'On Now'} · ${scen().label}`;
  view.innerHTML=`
    <div class="section"><h1>Prototype review</h1><p class="sub">Leave notes on what you see. Everyone who has this link can read them.</p></div>
    ${canW?`<div class="panel form">
      <div class="kinds" role="group" aria-label="Type of note">${KINDS.map(([k,l])=>`<button class="chip" data-kind="${k}" aria-pressed="${state.noteKind===k}">${l}</button>`).join('')}</div>
      <label class="sub" for="noteText">About: ${esc(ctx)}</label>
      <textarea id="noteText" maxlength="2000" placeholder="What stood out? What would you change?"></textarea>
      <div class="actions"><button class="btn" id="noteSend">Send note</button></div>
    </div>`:`<div class="note">You can read notes here. Ask for Contributor access to add your own.</div>`}
    <div class="section"><h2 id="noteHead">Notes</h2><div class="plays" id="noteList"></div></div>
    <div class="section"><h2>Shared setup</h2>
      <div class="panel"><div class="approw"><div class="info"><div class="nm" id="lbl-shared">Share my teams and apps</div>
        <div class="what">${canW?'Starred teams, apps, alerts and reminders sync live with everyone who opens this prototype.':'View-only. You see the shared setup, and your own changes stay on this device.'}</div></div>
        <button class="switch" role="switch" data-shared aria-labelledby="lbl-shared" aria-checked="${CLOUD.sharedOn}"></button></div></div>

async function sendNote(btn){
  const ta=document.getElementById('noteText'),text=ta.value.trim();
  if(!text){toast('Write a note first');return}
  btn.disabled=true;
  try{
    await CLOUD.db.collection('feedback').add({kind:state.noteKind,text:text.slice(0,2000),tab:state.from||'now',scen:state.scen,by:CLOUD.me,at:Date.now(),done:false});
    ta.value='';toast('Note sent');
  }catch(err){
    toast(err&&err.code==='invalid_argument'?'You need Contributor access to add notes':'Could not send. Try again in a moment');
  }
  btn.disabled=false;
}
async function toggleDone(id){
  const n=CLOUD.notes.find(x=>x.id===id);if(!n)return;
  try{await CLOUD.db.doc('feedback/'+id).update({done:!n.done})}catch(e){toast('Could not update that note')}
}
async function deleteNote(id){
  try{await CLOUD.db.doc('feedback/'+id).delete()}catch(e){toast('Could not delete that note')}
}
async function toggleShared(){
  CLOUD.sharedOn=!CLOUD.sharedOn;store.set('sharedOn',CLOUD.sharedOn);
  const sw=document.querySelector('[data-shared]');if(sw)sw.setAttribute('aria-checked',CLOUD.sharedOn);
  if(CLOUD.sharedOn&&CLOUD.db){try{onPrefs(await CLOUD.db.doc('shared/prefs').get())}catch(e){}}
  toast(CLOUD.sharedOn?'Using the shared setup':'Using your own setup on this device');
}
async function initCloud(){
  let db=null,user=null;
  try{db=await window.claude.use('db')}catch(e){}
  try{user=await window.claude.use('user')}catch(e){}
  if(!db)return;
  CLOUD.db=db;CLOUD.user=user;
  try{CLOUD.me=user?await user.id():null}catch(e){}
  try{CLOUD.canWrite=user?await user.can('data.write'):null}catch(e){}
  document.getElementById('tab-review').hidden=false;
  const dead=e=>{if(e&&e.code==='revoked'){CLOUD.db=null;document.getElementById('tab-review').hidden=true;if(state.tab==='review'){state.tab='now';render()}}};
  db.doc('shared/prefs').onSnapshot(onPrefs,dead);
  db.collection('feedback').orderBy('at','desc').limit(100).onSnapshot(onNotes,dead);
}

/* motion: welcome intro, tab and moment transitions, scoreboard effects. Reduced motion skips all of it. */
const RMQ=matchMedia('(prefers-reduced-motion: reduce)');
const EASE='cubic-bezier(.2,.9,.25,1)';
const TAB_ORDER=['now','later','teams','apps','review'];
const ON_GLYPHS={O:['.###.','#...#','#...#','#...#','#...#','#...#','.###.'],N:['#...#','##..#','#.#.#','#.#.#','#..##','#...#','#...#']};
let introFinish=null,scrambleTimer=0;
function blinkColon(s){return s.replace(/:/g,'<span class="cln">:</span>')}
function stagger(els,{dx=0,dy=10,step=45,dur=280,delay=0}={}){
  if(RMQ.matches)return;
  els.forEach((el,i)=>el.animate([{opacity:0,transform:`translate(${dx}px,${dy}px)`},{opacity:1,transform:'none'}],{duration:dur,delay:delay+Math.min(i,7)*step,easing:EASE,fill:'backwards'}));
}
function drawCharts(root=view,delay=0){
  if(RMQ.matches||!root)return;
  root.querySelectorAll('.spark').forEach(svg=>{
    svg.querySelector('.line')?.animate([{strokeDasharray:1,strokeDashoffset:1},{strokeDasharray:1,strokeDashoffset:0}],{duration:900,delay,easing:'cubic-bezier(.3,.7,.2,1)',fill:'backwards'});
    svg.querySelector('.area')?.animate([{opacity:0},{opacity:1}],{duration:600,delay:delay+300,fill:'backwards'});
    const pts=[...svg.querySelectorAll('.pt')];
    pts.forEach((c,i)=>c.animate([{transform:'scale(0)'},{transform:'scale(1.7)',offset:.6},{transform:'scale(1)'}],{duration:260,delay:delay+100+i*760/pts.length,fill:'backwards'}));
    svg.querySelectorAll('.nowpt,.halo').forEach(c=>c.animate([{transform:'scale(0)'},{transform:'scale(1.5)',offset:.6},{transform:'scale(1)'}],{duration:340,delay:delay+850,fill:'backwards'}));
  });
  root.querySelectorAll('.wpbar i').forEach((b,i)=>b.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:700,delay:delay+i*40,easing:EASE,fill:'backwards'}));
}
/* scoreboard update: digits roll through random numbers, then settle on the real value */
function scramble(){
  if(RMQ.matches)return;
  clearInterval(scrambleTimer);
  const nodes=[];
  document.querySelectorAll('#view .led .on,#view .wp-now,#view .sb-clk,#view .clock,#daytag').forEach(el=>{
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
    while((n=w.nextNode()))if(/\d/.test(n.data))nodes.push([n,n.data]);
  });
  let k=0;
  scrambleTimer=setInterval(()=>{
    const end=++k>7;
    nodes.forEach(([n,t])=>n.data=end?t:t.replace(/\d/g,()=>Math.random()*10|0));
    if(end)clearInterval(scrambleTimer);
  },55);
}
function ringBell(){
  const pip=document.getElementById('pip');
  if(RMQ.matches||pip.hidden)return;
  document.querySelector('.bell svg').animate([{transform:'rotate(0)'},{transform:'rotate(16deg)'},{transform:'rotate(-13deg)'},{transform:'rotate(9deg)'},{transform:'rotate(-5deg)'},{transform:'rotate(0)'}],{duration:750,delay:150,easing:'ease-out'});
  pip.animate([{transform:'scale(0)'},{transform:'scale(1.3)',offset:.6},{transform:'scale(1)'}],{duration:380,delay:150,fill:'backwards'});
}
function tabFX(from,to){
  const d=Math.sign(TAB_ORDER.indexOf(to)-TAB_ORDER.indexOf(from));
  stagger([...view.children],{dx:d*22,dy:0,step:40,dur:300});
  drawCharts(view,150);
}
/* switching weekend moments: the board flickers like a power change, then scores roll and charts redraw */
function sceneFX(){
  if(RMQ.matches)return;
  view.animate([{opacity:.3},{opacity:1,offset:.3},{opacity:.55,offset:.5},{opacity:1}],{duration:320});
  scramble();drawCharts(view,120);ringBell();
}
function enterFX(full){
  if(RMQ.matches)return;
  if(full){
    document.querySelector('.top').animate([{transform:'translateY(-100%)',opacity:0},{transform:'none',opacity:1}],{duration:420,easing:EASE,fill:'backwards'});
    document.querySelector('.nav').animate([{transform:'translateY(100%)'},{transform:'none'}],{duration:420,delay:80,easing:EASE,fill:'backwards'});
  }
  stagger([document.getElementById('demo'),...view.children],{dy:16,step:55,dur:380,delay:full?120:0});
  drawCharts(view,full?450:200);
  setTimeout(()=>{scramble();ringBell()},full?520:150);
}
/* welcome: the icon's board powers up (green lamp blinks, dots light column by column into ON),
   the name and tagline come in, then the app slides into place. Tap anywhere to skip; tap the logo to replay. */
function playIntro(){
  document.querySelector('.intro')?.remove();
  const rows=ON_GLYPHS.O.map((o,r)=>o+'.'+ON_GLYPHS.N[r]);
  const tag='YOUR TEAMS · LIVE NOW · ON YOUR APPS';
  const el=document.createElement('div');el.className='intro';el.setAttribute('aria-hidden','true');
  el.innerHTML=`<div class="ibox"><span class="ipow"></span><div class="imat">${rows.map((row,r)=>[...row].map((ch,c)=>`<i class="d${ch==='#'?' l':''}" style="--c:${c};--r:${r}"></i>`).join('')).join('')}</div></div>
    <div class="iword">WhereIts<b>On</b></div><div class="itag" style="--n:${tag.length}">${tag}</div><div class="iskip">Tap to skip</div>`;
  document.body.appendChild(el);
  const finish=()=>{
    if(introFinish!==finish)return;
    introFinish=null;clearTimeout(timer);
    if(RMQ.matches)return el.remove();
    el.classList.add('out');enterFX(true);
    setTimeout(()=>el.remove(),520);
  };
  const timer=setTimeout(finish,RMQ.matches?1400:2500);
  el.addEventListener('pointerdown',finish);
  introFinish=finish;
  try{sessionStorage.setItem('wio.intro','1')}catch(e){}
}

/* invite-only preview: personal invite links, visit tracking, feedback notes with a vote leaderboard, a 3-tap survey.
   The backend is a Google Sheet's Apps Script web app (feedback/Code.gs, setup in feedback/SETUP.md).
   Leave FEEDBACK_URL empty for an open demo with no gate and no feedback button. */
const FEEDBACK_URL='';
const FB_KINDS=[['Idea','Idea'],['Problem','Problem'],['Like','Like']];
const fb={invite:store.get('invite',null),view:'write',kind:'Idea',draft:'',board:null,surveyClock:0,surveySecs:0};
async function api(a,body={},code){
  let res;
  try{res=await fetch(FEEDBACK_URL,{method:'POST',body:JSON.stringify({a,code:code||fb.invite?.code,...body})})}
  catch(e){throw Object.assign(new Error('offline'),{code:'offline'})}
  let j;try{j=await res.json()}catch(e){throw Object.assign(new Error('server'),{code:'server'})}
  if(!j.ok){if(j.error==='invite'&&!code)lockOut();throw Object.assign(new Error(j.error),{code:j.error})}
  return j;
}
function fbErr(e){return ({offline:'You seem to be offline. Try again when you are connected.',rate:'That is a lot of feedback at once. Try again in a little while.',invite:'Your invite is no longer active.',gone:'That note was removed.'})[e.code]||'Something went wrong. Try again in a moment.'}
function visitCtx(){
  const ua=navigator.userAgent;
  const device=/Android/.test(ua)?'Android':/iPhone|iPad|iPod/.test(ua)?'iPhone/iPad':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'Other';
  return {device,screen:innerWidth+'x'+innerHeight,installed:matchMedia('(display-mode: standalone)').matches};
}

/* gate */
function showGate(msg='',err=false){
  let g=document.querySelector('.gate');
  if(!g){
    g=document.createElement('div');g.className='gate';
    g.innerHTML=`<div class="gword">WhereIts<b>On</b></div><div class="gtag">PREVIEW · INVITE ONLY</div>
      <p class="sub">Open the invite link you were sent, or enter your code.</p>
      <form class="gform"><input class="gcode" name="code" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Invite code"><button class="btn">Enter</button></form>
      <div class="gmsg" role="status"></div>
      <p class="gnote">The WhereItsOn team sees your visits, survey answers and notes. Other testers see notes without your name.</p>`;
    g.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const c=g.querySelector('.gcode').value.trim().toUpperCase();if(c)unlock(c)});
    document.body.appendChild(g);
  }
  const m=g.querySelector('.gmsg');m.textContent=msg;m.classList.toggle('err',err);
  return g;
}
function hideGate(){
  const g=document.querySelector('.gate');if(!g)return;
  if(RMQ.matches)return g.remove();
  g.classList.add('out');setTimeout(()=>g.remove(),360);
}
async function unlock(code){
  const g=showGate('Checking your invite…');g.querySelector('button').disabled=true;
  try{
    const j=await api('hello',{ctx:visitCtx()},code);
    fb.invite={code,name:j.name||''};store.set('invite',fb.invite);
    hideGate();toast(fb.invite.name?`Welcome to the preview, ${fb.invite.name}`:'Welcome to the preview');
    if(!document.querySelector('.intro'))enterFX(true);
    onUnlocked(j);
  }catch(e){
    showGate(e.code==='invite'?'That invite is not active. Check the link you were sent.':e.code==='offline'?'You seem to be offline. Connect and try again.':'Could not reach the preview right now. Try again in a moment.',true);
  }
  g.querySelector('button').disabled=false;
}
function lockOut(){
  fb.invite=null;store.set('invite',null);
  document.getElementById('fab')?.remove();document.body.classList.remove('has-fab');clearInterval(fb.surveyClock);fb.surveyClock=0;
  document.querySelectorAll('.scrim').forEach(s=>s.remove());
  showGate('This invite is no longer active.',true);
}
function onUnlocked(j){
  if(j&&j.survey)store.set('survey','done');
  if(!document.getElementById('fab')){
    const b=document.createElement('button');b.className='fab';b.id='fab';b.dataset.feedback='';
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Feedback';
    document.getElementById('app').appendChild(b);
  }
  document.body.classList.add('has-fab');
  startSurveyClock();
}
function initPreview(){
  if(!FEEDBACK_URL)return;
  const m=/[?&#]invite=([A-Za-z0-9]{4,12})/.exec(location.search+location.hash);
  if(m){history.replaceState(null,'',location.pathname);unlock(m[1].toUpperCase());return}
  if(!fb.invite){showGate();return}
  onUnlocked();
  api('hello',{ctx:visitCtx()}).then(j=>{if(j.survey)store.set('survey','done')}).catch(()=>{}); // offline keeps a known tester in
}

/* feedback sheet: leave a note, or vote on the leaderboard */
function openFeedback(view){
  if(view)fb.view=view;
  showSheet(`<span class="grab"></span><div class="sheet-title">Feedback</div>
    <div class="seg2" role="group" aria-label="Feedback view"><button class="chip" data-fbview="write">Leave a note</button><button class="chip" data-fbview="board">Leaderboard</button></div>
    <div id="fbBody"></div><div class="actions"><button class="btn ghost" data-close>Close</button></div>`,
  (e,scrim)=>{
    const v=e.target.closest('[data-fbview]');if(v){fb.view=v.dataset.fbview;renderFb();return}
    const k=e.target.closest('[data-fbkind]');if(k){fb.kind=k.dataset.fbkind;renderFb();return}
    if(e.target.closest('#fbSend')){postNote();return}
    const vt=e.target.closest('[data-vote]');if(vt&&!vt.disabled)castVote(vt.dataset.vote);
  });
  renderFb();
}
function renderFb(){
  const body=document.getElementById('fbBody');if(!body)return;
  document.querySelectorAll('[data-fbview]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.fbview===fb.view));
  if(fb.view==='write'){
    body.innerHTML=`<div class="q"><div class="kinds" role="group" aria-label="Type of note">${FB_KINDS.map(([k,l])=>`<button class="chip" data-fbkind="${k}" aria-pressed="${fb.kind===k}">${l}</button>`).join('')}</div>
      <label class="sub" for="fbText">About: ${esc(TABNAMES[state.tab]||'On Now')} · ${esc(scen().label)}</label>
      <textarea id="fbText" maxlength="500" placeholder="${fb.kind==='Problem'?'What went wrong or felt confusing?':fb.kind==='Like'?'What works well for you?':'What would make this better?'}">${esc(fb.draft)}</textarea>
      <div class="fbrow"><span class="sub" id="fbCount">${fb.draft.length}/500</span><button class="btn" id="fbSend">Send</button></div>
      <p class="sub">Other testers see your note without your name and can vote for it. Notes that attack people are held for review.</p></div>`;
    const ta=document.getElementById('fbText');
    ta.addEventListener('input',()=>{fb.draft=ta.value;document.getElementById('fbCount').textContent=ta.value.length+'/500'});
    return;
  }
  body.innerHTML=`<p class="sub">Vote for the changes you want most. The team marks what is planned and done.</p><div class="lb" id="lbList">${fb.board?boardHTML():'<div class="empty">Loading the leaderboard…</div>'}</div>`;
  if(!fb.board)loadBoard();
}
async function loadBoard(){
  try{fb.board=(await api('board')).items}
  catch(e){const l=document.getElementById('lbList');if(l)l.innerHTML=`<div class="empty">${esc(fbErr(e))}</div>`;return}
  const l=document.getElementById('lbList');if(l){l.innerHTML=boardHTML();stagger([...l.children],{dy:8,step:35,dur:260})}
}
function boardHTML(){
  if(!fb.board.length)return '<div class="empty">No notes yet. Be the first: switch to Leave a note.</div>';
  return fb.board.map(n=>{
    const kind=FB_KINDS.some(([k])=>k===n.kind)?n.kind:'Idea';
    return `<div class="lbi${n.pending?' pending':''}">
      <button class="vote" data-vote="${esc(n.id)}" aria-pressed="${n.voted}" ${n.mine||n.pending?'disabled':''} aria-label="${n.mine?'Your note':'Vote'}, ${n.votes} votes">▲<b>${n.votes}</b></button>
      <div><div class="lbm"><span class="pill ${kind.toLowerCase()}">${esc(kind)}</span>${n.stage&&n.stage!=='New'?`<span class="pill stage">${esc(n.stage)}</span>`:''}${n.mine?'<span class="pill mine">Yours</span>':''}${n.pending?'<span class="pill wait">Waiting for review</span>':''}</div>
      <div class="nc-text">${esc(n.text)}</div><div class="lbc">${esc(n.ctx)}${n.ctx?' · ':''}${esc(ago(n.at||Date.now()))}</div></div></div>`}).join('');
}
async function postNote(){
  const btn=document.getElementById('fbSend'),text=fb.draft.trim();
  if(!text){toast('Write a note first');return}
  btn.disabled=true;btn.textContent='Sending…';
  try{
    const j=await api('note',{kind:fb.kind,text,ctx:`${TABNAMES[state.tab]||'On Now'} · ${scen().label}`});
    fb.draft='';fb.board=null;fb.view='board';renderFb();
    toast(j.held?'Thanks. Your note is waiting for a quick review.':'Thanks! Your note is on the leaderboard.');
  }catch(e){toast(fbErr(e));btn.disabled=false;btn.textContent='Send'}
}
async function castVote(id){
  const n=fb.board&&fb.board.find(x=>x.id===id);if(!n)return;
  n.voted=!n.voted;n.votes+=n.voted?1:-1;
  const l=document.getElementById('lbList');if(l)l.innerHTML=boardHTML();
  try{const j=await api('vote',{id});n.votes=j.votes;n.voted=j.voted}
  catch(e){n.voted=!n.voted;n.votes+=n.voted?1:-1;toast(fbErr(e))}
  const l2=document.getElementById('lbList');if(l2)l2.innerHTML=boardHTML();
}

/* 3-tap survey: offered once after about 90 seconds of use, at most three launches, never again once answered */
function startSurveyClock(){
  if(store.get('survey',0)==='done'||fb.surveyClock)return;
  fb.surveyClock=setInterval(()=>{
    if(document.visibilityState!=='visible'||document.querySelector('.scrim,.intro,.gate'))return;
    fb.surveySecs+=5;
    if(fb.surveySecs>=90){clearInterval(fb.surveyClock);openSurvey()}
  },5000);
}
function openSurvey(force){
  const shown=store.get('survey',0);
  if(shown==='done'||(!force&&shown>=3))return;
  store.set('survey',shown+1);
  const sv={stars:0,use:''};
  const paint=scrim=>{
    scrim.querySelectorAll('[data-rate]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.rate<=sv.stars));
    scrim.querySelectorAll('[data-use]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.use===sv.use));
    scrim.querySelector('#svSend').disabled=!(sv.stars&&sv.use);
  };
  const scrim=showSheet(`<span class="grab"></span><div class="sheet-title">Quick 3 taps</div>
    <p class="sub">Help shape WhereItsOn. It takes about ten seconds.</p>
    <div class="q"><div class="ql" id="svq1">How useful is it?</div><div class="rates" role="group" aria-labelledby="svq1">${[1,2,3,4,5].map(i=>`<button class="rate" data-rate="${i}" aria-pressed="false" aria-label="${i} star${i>1?'s':''}">★</button>`).join('')}</div></div>
    <div class="q"><div class="ql" id="svq2">Would you use it on game day?</div><div class="kinds" role="group" aria-labelledby="svq2">${['Yes','Maybe','No'].map(u=>`<button class="chip" data-use="${u}" aria-pressed="false">${u}</button>`).join('')}</div></div>
    <div class="q"><label class="ql" for="svText">One thing you'd change? <span>(optional)</span></label><input class="search" id="svText" maxlength="200" autocomplete="off"></div>
    <div class="actions"><button class="btn ghost" data-close>Not now</button><button class="btn" id="svSend" disabled>Send</button></div>`,
  async(e,scrim)=>{
    const r=e.target.closest('[data-rate]');if(r){sv.stars=+r.dataset.rate;paint(scrim);return}
    const u=e.target.closest('[data-use]');if(u){sv.use=u.dataset.use;paint(scrim);return}
    const s=e.target.closest('#svSend');if(!s||s.disabled)return;
    s.disabled=true;s.textContent='Sending…';
    try{await api('survey',{stars:sv.stars,use:sv.use,change:scrim.querySelector('#svText').value.trim()});store.set('survey','done');closeSheet(scrim);toast('Thanks! That really helps.')}
    catch(e){toast(fbErr(e));s.disabled=false;s.textContent='Send'}
  });
}
document.addEventListener('click',e=>{if(e.target.closest('[data-feedback]'))openFeedback()});

render();
initCloud();
/* intro once per app launch (tap the logo to see it again) */
let introSeen=false;try{introSeen=!!sessionStorage.getItem('wio.intro')}catch(e){}
if(!introSeen&&!RMQ.matches)playIntro();else enterFX(false);
initPreview();
try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0&&window.top===window)navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}
</script>
